name: Docker CI/CD Practice

on:
  push:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Show repository files
        run: ls -la

      - name: Build Docker image
        run: docker build -t practice:01 .

      - name: Create and run container
        run: docker run -d --name site -p 8080:80 practice:01

      - name: Verify container is running
        run: docker ps

      - name: Test page response
        run: curl --fail http://localhost:8080

      - name: Deploy application
        run: echo "Deployment step would run here"
